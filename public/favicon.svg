<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e8ecf1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="innerPlateGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="islandSurface" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="25%" stop-color="#4ade80"/>
      <stop offset="65%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="islandExtrudeDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#dfb278"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a367"/>
      <stop offset="100%" stop-color="#b88347"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b07d42"/>
      <stop offset="100%" stop-color="#8c5d26"/>
    </linearGradient>
    <linearGradient id="shieldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="46" y="42" width="420" height="420" rx="94" fill="url(#bezelGrad)"/>
  <rect x="56" y="52" width="400" height="400" rx="84" fill="url(#innerPlateGrad)"/>

  <!-- ADMIN Text -->
  <text x="96" y="103" font-family="'Cairo', system-ui, sans-serif" font-size="26" font-weight="900" fill="#475569" letter-spacing="1.5">ADMIN</text>

  <!-- Bahrain Island 3D with Accurate Geography -->
  <path d="M 175 200 L 175 226 C 165 266 170 306 180 346 C 190 376 205 406 215 436 C 225 466 240 488 260 478 L 260 455 C 240 465 225 440 215 410 C 205 380 190 350 180 320 C 170 280 165 240 175 200 Z" fill="url(#islandExtrudeDark)"/>
  <path d="M 235 110 C 265 95 285 105 295 125 C 305 145 295 170 285 195 C 275 220 295 255 315 285 C 325 310 320 340 310 375 C 300 415 280 445 260 455 C 240 465 225 440 215 410 C 205 380 190 350 180 320 C 170 280 165 240 175 200 C 185 160 205 125 235 110 Z" fill="url(#islandSurface)"/>
  
  <!-- Muharraq Island -->
  <path d="M 295 75 C 330 65 365 85 360 125 C 350 150 320 145 295 75 Z" fill="url(#islandSurface)"/>
  
  <!-- Sitra & Umm an Nasan -->
  <ellipse cx="319" cy="207" rx="10" ry="16" fill="url(#islandSurface)"/>
  <ellipse cx="143" cy="178" rx="13" ry="18" fill="url(#islandSurface)"/>

  <!-- Hawar Islands -->
  <ellipse cx="380" cy="303" rx="8" ry="12" fill="#0d9488"/>
  <ellipse cx="400" cy="325" rx="10" ry="16" fill="#0d9488"/>

  <!-- Radar Rings -->
  <ellipse cx="256" cy="245" rx="46" ry="36" fill="none" stroke="#4ade80" stroke-width="3" opacity="0.9"/>
  <ellipse cx="256" cy="245" rx="85" ry="65" fill="none" stroke="#22c55e" stroke-width="2.5" opacity="0.8"/>
  <ellipse cx="256" cy="245" rx="120" ry="92" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.6"/>

  <!-- Cardboard Box -->
  <g transform="translate(212, 192)">
    <polygon points="44,0 88,24 44,48 0,24" fill="url(#boxTop)"/>
    <polygon points="0,24 44,48 44,100 0,76" fill="url(#boxLeft)"/>
    <polygon points="44,48 88,24 88,76 44,100" fill="url(#boxRight)"/>
    <polygon points="40,2 50,7 28,50 18,45" fill="#fef08a"/>
    <polygon points="18,45 28,50 28,100 18,96" fill="#fef08a"/>
  </g>

  <!-- Key with Gold Shield -->
  <g transform="translate(156, 278)">
    <path d="M 20 30 L 82 -7" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
    <circle cx="18" cy="32" r="23" fill="#ffffff" stroke="#4ade80" stroke-width="3"/>
    <path d="M 18 18 L 29 22 C 29 31 25 39 18 44 C 11 39 7 31 7 22 Z" fill="url(#shieldGold)"/>
  </g>

  <!-- Admin Panel Badge -->
  <rect x="306" y="390" width="142" height="44" rx="14" fill="#ffffff" opacity="0.9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="377" y="417" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="900" fill="#334155" letter-spacing="0.8">ADMIN PANEL</text>
</svg>
