services:
  - type: web
    name: orderi-admin
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SUPABASE_URL
        value: https://mczxrgjuelqjmxbtzbxj.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: ORDERI_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
